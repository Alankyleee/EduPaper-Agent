name: Bootstrap source tree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .github/source-bundle ]; then
            echo "Source bundle already expanded."
            exit 0
          fi

          cat .github/source-bundle/part-* > /tmp/edupaper-source.b64
          base64 --decode /tmp/edupaper-source.b64 > /tmp/edupaper-source.tar.gz
          tar -xzf /tmp/edupaper-source.tar.gz -C .
          rm -rf .github/source-bundle

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "feat: add complete EduPaper Agent implementation"
          git push origin HEAD:main
