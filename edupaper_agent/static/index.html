<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EduPaper Agent</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    body { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { margin-bottom: 4px; }
    .muted { opacity: .72; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
    .card { border: 1px solid #8885; border-radius: 16px; padding: 18px; }
    label { display: block; font-weight: 650; margin: 12px 0 6px; }
    input, select, textarea, button { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid #8887; }
    textarea { min-height: 120px; resize: vertical; }
    button { cursor: pointer; font-weight: 700; margin-top: 12px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #8881; padding: 14px; border-radius: 10px; min-height: 120px; }
    .full { grid-column: 1 / -1; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>EduPaper Agent</h1>
  <div class="muted">教育论文 PDF 入库、向量检索、arXiv 补充检索与可追溯问答。</div>
  <div class="grid">
    <section class="card">
      <h2>1. 上传 PDF</h2>
      <input id="pdf" type="file" accept="application/pdf" />
      <label for="parser">解析器</label>
      <select id="parser">
        <option value="auto">自动（PyMuPDF → MinerU → PaddleOCR）</option>
        <option value="pymupdf">PyMuPDF</option>
        <option value="mineru">MinerU</option>
        <option value="paddleocr">PaddleOCR</option>
      </select>
      <button id="upload">上传并入库</button>
      <pre id="uploadResult">等待上传…</pre>
    </section>
    <section class="card">
      <h2>2. Agent 问答</h2>
      <label for="mode">模式</label>
      <select id="mode"><option value="qa">问答</option><option value="review">综述</option><option value="compare">比较</option></select>
      <label for="query">问题</label>
      <textarea id="query">这篇论文的研究问题、方法、主要发现和局限是什么？</textarea>
      <label><input id="arxiv" type="checkbox" checked style="width:auto" /> 证据不足时检索 arXiv</label>
      <button id="ask">运行 Agent</button>
    </section>
    <section class="card full">
      <h2>回答</h2>
      <pre id="answer">等待提问…</pre>
    </section>
    <section class="card full">
      <h2>引用与 Trace</h2>
      <pre id="details">—</pre>
    </section>
  </div>
<script>
const uploadResult = document.querySelector('#uploadResult');
const answer = document.querySelector('#answer');
const details = document.querySelector('#details');

document.querySelector('#upload').onclick = async () => {
  const file = document.querySelector('#pdf').files[0];
  if (!file) return alert('请选择 PDF');
  uploadResult.textContent = '上传中…';
  const form = new FormData(); form.append('file', file);
  const parser = document.querySelector('#parser').value;
  const response = await fetch(`/v1/documents/upload?parser=${encodeURIComponent(parser)}`, {method: 'POST', body: form});
  uploadResult.textContent = JSON.stringify(await response.json(), null, 2);
};

document.querySelector('#ask').onclick = async () => {
  answer.textContent = '运行中…'; details.textContent = '—';
  const payload = {
    query: document.querySelector('#query').value,
    mode: document.querySelector('#mode').value,
    top_k: 6,
    allow_arxiv_search: document.querySelector('#arxiv').checked
  };
  const response = await fetch('/v1/agent/query', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
  const data = await response.json();
  answer.textContent = data.answer || JSON.stringify(data, null, 2);
  details.textContent = JSON.stringify({citations: data.citations, warnings: data.warnings, trace: data.trace}, null, 2);
};
</script>
</body>
</html>
