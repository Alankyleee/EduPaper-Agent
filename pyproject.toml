[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edupaper-agent"
version = "0.3.0"
description = "Traceable educational paper research agent with LangGraph, Chroma, MinerU/PaddleOCR and FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alankyleee"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12,<1",
  "pydantic>=2.8,<3",
  "langgraph>=0.4,<2",
  "openai>=1.60,<3",
  "chromadb>=0.6,<2",
  "PyMuPDF>=1.24,<2",
  "arxiv>=2.1,<3",
  "scikit-learn>=1.5,<2",
  "numpy>=1.26,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.8,<1"]
paddleocr = ["paddleocr[doc-parser]>=3.5,<4"]
mineru = ["mineru[all]>=3,<4"]
parsers = ["paddleocr[doc-parser]>=3.5,<4", "mineru[all]>=3,<4"]

[tool.setuptools.packages.find]
include = ["edupaper_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
